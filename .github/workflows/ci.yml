name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build package
        run: pnpm build

      - name: Pack package
        run: pnpm pack --pack-destination /tmp

      - name: Build preview
        run: pnpm build:preview

      - name: Lint Next.js example
        run: pnpm --filter react-linkedin-login-oauth2-nextjs-example lint

      - name: Build Next.js example
        run: pnpm --filter react-linkedin-login-oauth2-nextjs-example build
